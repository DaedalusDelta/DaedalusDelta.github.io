<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% include seo-head.html %}
  {% assign asset_version = site.github.build_revision | default: site.time %}
  <link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}?v={{ asset_version | url_encode }}">
</head>
<script src="{{ '/assets/js/hover-video.js' | relative_url }}" defer></script>
<script src="{{ '/assets/js/contact-actions.js' | relative_url }}" defer></script>
<script src="{{ '/assets/js/scroll-nav.js' | relative_url }}" defer></script>
<body{% if page.url == '/blog/' %} class="blog"{% elsif page.url == '/' %} class="site-home"{% elsif page.url == '/about/' %} class="site-about"{% endif %}>
  {% include header.html %}

  <main class="page-content">
    {{ content }}
  </main>
</body>
</html>
