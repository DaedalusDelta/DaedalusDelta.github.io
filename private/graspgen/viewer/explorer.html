<!doctype html>
<html lang="en"><head><meta name="robots" content="noindex, nofollow, noarchive"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Generated grasp explorer · LEAP</title>
<script type="module" src="vendor/model-viewer-4.1.0.min.js"></script>
<style>
*{box-sizing:border-box} :root{font-family:Inter,system-ui,sans-serif;color:#26313b;background:#fff;font-size:14px}body{margin:0}button,select,input,a{font:inherit}button,select,input{border:1px solid #d8d7df;border-radius:8px;background:white;color:inherit;padding:9px 10px}button{cursor:pointer}button:hover{background:#f4f0fa}button:disabled{opacity:.4;cursor:default}button.active{background:#eee5fc;border-color:#9676b5;color:#54396e}a{color:#634780}header{border-bottom:1px solid #e9e6ed;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:21px;margin:0 0 4px}header p{margin:0;color:#63717c}.layout{display:grid;grid-template-columns:320px minmax(0,1fr);height:calc(100vh - 91px)}aside{border-right:1px solid #e9e6ed;display:flex;flex-direction:column;overflow:hidden;padding:16px;gap:12px}.filters{display:grid;gap:9px}.filters label{display:grid;gap:4px;font-size:12px;color:#5f6978}.filters select{width:100%}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:8px}#list{overflow:auto;flex:1;display:flex;flex-direction:column;gap:7px;min-height:70px}.entry{text-align:left;padding:10px 12px;border:1px solid #e8e4ee;background:#fff;flex:none}.entry.active{border-color:#9872b4;background:#f5eefc}.entry strong{display:block;font-size:14px;margin-bottom:4px}.entry small{display:block;line-height:1.4;color:#626577}.entry .dot{float:right;width:8px;height:8px;border-radius:50%;margin:5px 0 0 6px}.passdot{background:#4c9278}.faildot{background:#ca8467}.pager{display:flex;align-items:center;justify-content:space-between;gap:6px}main{display:flex;flex-direction:column;min-width:0;overflow:auto}.top{padding:16px 22px 10px}.top h2{font-size:22px;margin:0 0 5px}.subtitle{color:#647180}.badges{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.badge{font-size:12px;padding:5px 9px;border-radius:6px;background:#f3f2f6}.badge.pass{background:#e6f3ec;color:#2e7253}.badge.fail{background:#fcebe5;color:#97523e}.toolbar{display:flex;flex-wrap:wrap;gap:7px;padding:12px 22px;border-top:1px solid #f0edf4;border-bottom:1px solid #f0edf4}.separator{width:1px;background:#e1dce7;margin:0 3px}#viewport{position:relative;flex:1;min-height:350px;background:#fff}model-viewer{width:100%;height:100%;min-height:350px;--progress-bar-color:#a685bf;--progress-bar-height:3px;background:#fff;touch-action:none}#hint{position:absolute;bottom:12px;left:18px;padding:7px 10px;border-radius:7px;background:#faf8fdeb;color:#5a6471;font-size:12px;pointer-events:none}#load{position:absolute;top:10px;right:18px;font-size:12px;color:#66707e;pointer-events:none}footer{padding:12px 22px;border-top:1px solid #eee9f4;font-size:12px;line-height:1.65;color:#5c6875}.metrics{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:6px}details summary{cursor:pointer}#provenance{word-break:break-all;padding-top:5px}#fatal{display:none;background:#fff0ec;color:#923b25;padding:14px;white-space:pre-wrap}#empty{padding:20px}#clear{font-size:12px} .legend{font-size:12px}.swatch{display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 5px 0 10px}.swatch.hand{background:#b8a0e0}.swatch.object{background:#f2b38f}@media(max-width:800px){.layout{grid-template-columns:235px minmax(0,1fr)}header{padding:12px}.top,.toolbar,footer{padding-left:12px;padding-right:12px}.top h2{font-size:18px}}@media(max-width:550px){.layout{display:flex;flex-direction:column;height:auto}aside{max-height:340px;border-right:0}#list{min-height:90px}model-viewer{height:500px}.legend{display:none}}
</style></head><body>
<header><div><h1>Generated grasp explorer</h1><p id="overview">Loading the saved grasp catalog…</p></div><div class="legend"><span class="swatch hand"></span>LEAP hand <span class="swatch object"></span>Object · <a href="comparison.html">Defaults vs adapted: results</a> · <a href="report.html">Study report</a></div></header>
<div id="fatal" role="alert"></div><div class="layout">
<aside>
<div class="filters"><label>Object<select id="object" aria-label="Object filter"><option value="">All objects</option></select></label><label>Method<select id="method" aria-label="Method filter"><option value="">All methods</option></select></label><div class="twocol"><label>Physical outcome<select id="outcome" aria-label="Outcome filter"><option value="">Passes + failures</option><option value="pass">All tests pass</option><option value="fail">At least one fails</option></select></label><label>Examples<select id="featured" aria-label="Example filter"><option value="">All examples</option><option value="yes">Featured nine</option></select></label></div></div>
<div class="pager"><span id="count"></span><button id="clear">Clear filters</button></div><div id="list" aria-label="Generated grasp examples"></div><div class="pager"><button id="pagePrev" aria-label="Previous page">←</button><span id="pageInfo"></span><button id="pageNext" aria-label="Next page">→</button></div>
</aside>
<main>
<div class="top"><h2 id="title">Choose a grasp</h2><div class="subtitle" id="subtitle"></div><div class="badges" id="badges"></div></div>
<div class="toolbar"><button id="previous" aria-label="Previous grasp">← Previous grasp</button><button id="next" aria-label="Next grasp">Next grasp →</button><span class="separator"></span><button id="closed" class="active">After closure</button><button id="final">After movement</button><span class="separator"></span><button id="fit">Fit / reset view</button><button id="front">Front</button><button id="back">Back</button><button id="top">Top</button><button id="zoomIn" aria-label="Zoom in">＋</button><button id="zoomOut" aria-label="Zoom out">−</button></div>
<div id="viewport"><model-viewer id="model" camera-controls interaction-prompt="none" environment-image="neutral" shadow-intensity="0" exposure="1" camera-orbit="52deg 128deg auto" min-camera-orbit="auto 1deg 30%" max-camera-orbit="auto 179deg 500%" camera-target="auto auto auto" field-of-view="32deg" interpolation-decay="80" aria-label="Interactive 3D generated grasp. Drag to rotate; scroll to zoom."></model-viewer><span id="load" role="status">Loading…</span><span id="hint">Drag: rotate · Scroll: zoom · Shift-drag / right-drag: pan</span></div>
<footer><div class="metrics" id="metrics"></div><div id="stateNote"></div><details><summary>Evidence, selection and downloads</summary><div id="provenance"></div></details></footer>
</main></div>
<script>
const $=id=>document.getElementById(id), mv=$('model');let all=[],filtered=[],selected=null,stage='closed',page=0,currentSrc='',loadedSrc='';const pageSize=12;
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fatal(e){$('fatal').style.display='block';$('fatal').textContent='Viewer could not load: '+(e.message||e);$('load').textContent='Load failed'}
window.addEventListener('error',e=>fatal(e.error||e.message));window.addEventListener('unhandledrejection',e=>fatal(e.reason));
function badge(name,value){return `<span class="badge ${value?'pass':'fail'}">${name}: ${value?'pass':'fail'}</span>`}
function renderList(){
 $('count').textContent=filtered.length+' examples';const pages=Math.max(1,Math.ceil(filtered.length/pageSize));page=Math.min(page,pages-1);$('pageInfo').textContent=`Page ${page+1} / ${pages}`;$('pagePrev').disabled=page===0;$('pageNext').disabled=page===pages-1;$('list').replaceChildren();
 for(const c of filtered.slice(page*pageSize,(page+1)*pageSize)){
  const b=document.createElement('button');b.className='entry'+(selected&&c.id===selected.id?' active':'');b.setAttribute('aria-label',`${c.object}, ${Math.max(...c.dimensions_mm)} mm, ${c.method}, candidate ${c.candidate}`);b.innerHTML=`<span class="dot ${c.combined_pass?'passdot':'faildot'}"></span><strong>${esc(c.object[0].toUpperCase()+c.object.slice(1))} · ${Math.max(...c.dimensions_mm)} mm</strong><small>${esc(c.method)} · #${esc(c.candidate)}</small>${c.featured?'<small>★ Featured example</small>':''}`;b.onclick=()=>select(c);$('list').append(b)
 }
 $('previous').disabled=!selected||filtered.findIndex(c=>c.id===selected.id)<=0;$('next').disabled=!selected||filtered.findIndex(c=>c.id===selected.id)>=filtered.length-1;
}
function resetView(){mv.cameraTarget='auto auto auto';mv.cameraOrbit='52deg 128deg auto';mv.fieldOfView='32deg';mv.jumpCameraToGoal()}
function markReady(){ $('load').textContent='3D ready · '+(stage==='closed'?'after closure':'after movement'); $('load').dataset.ready='true'; }
function showState(){if(!selected)return;$('closed').classList.toggle('active',stage==='closed');$('final').classList.toggle('active',stage==='final');$('load').textContent='Loading 3D geometry…';$('load').dataset.ready='false';mv.dataset.caseId=selected.id;mv.dataset.stage=stage;const nextSrc=selected.models[stage].file;if(loadedSrc===nextSrc){markReady()}if(currentSrc!==nextSrc){currentSrc=nextSrc;mv.src=nextSrc}resetView();$('stateNote').textContent=stage==='closed'?'Recorded physical state after the hand closed. This is not an unexecuted target configuration.':'Recorded final state after the lift and rotation test. Failed grasps may show the object separated from the hand.';history.replaceState(null,'','#'+selected.id+'/'+stage);renderEvidence()}
function renderEvidence(){const c=selected;$('provenance').innerHTML=`<a href="${esc(c.models[stage].file)}" download>Download this 3D mesh (GLB)</a> · <a href="${esc(c.audit_url)}" target="_blank">Recorded physics evidence</a><br>${esc(c.selection)}<br>These are selected accepted candidates, not a success-rate sample. All rejected attempts remain in the study report.<br>Audit: ${esc(c.audit)}`}
function select(c){selected=c;page=Math.floor(filtered.findIndex(x=>x.id===c.id)/pageSize);$('title').textContent=c.featured||`${c.object[0].toUpperCase()+c.object.slice(1)} — candidate ${c.candidate}`;$('subtitle').textContent=`${c.method} · ${c.dimensions_mm.join(' × ')} mm · LEAP right hand`;$('badges').innerHTML=badge('Repo test',c.source_pass)+badge('Relative hold',c.relative_pass)+badge('Lift + rotation',c.motion_pass)+(c.handle_pass===null||c.handle_pass===undefined?'':badge('Handle contacts',c.handle_pass));$('metrics').innerHTML=`<span>Motion tracking error: <b>${c.motion_error_mm} mm / ${c.motion_error_deg}°</b></span><span>Contacting hand bodies after closure: <b>${c.contact_bodies}</b></span>`;renderList();showState()}
function filter(){filtered=all.filter(c=>(!$('object').value||c.object===$('object').value)&&(!$('method').value||c.method===$('method').value)&&(!$('outcome').value||c.combined_pass===($('outcome').value==='pass'))&&(!$('featured').value||c.featured));page=0;if(filtered.length)select(filtered.find(c=>selected&&c.id===selected.id)||filtered[0]);else{selected=null;currentSrc='';loadedSrc='';mv.src='';$('title').textContent='No matching grasps';$('subtitle').textContent='Change or clear the filters.';$('badges').replaceChildren();$('metrics').replaceChildren();$('stateNote').textContent='';$('provenance').replaceChildren();$('load').textContent='No matching grasps';renderList()}}
for(const id of ['object','method','outcome','featured'])$(id).onchange=filter;
$('clear').onclick=()=>{for(const id of ['object','method','outcome','featured'])$(id).value='';filter()};$('pagePrev').onclick=()=>{page--;renderList()};$('pageNext').onclick=()=>{page++;renderList()};
$('previous').onclick=()=>select(filtered[filtered.findIndex(c=>c.id===selected.id)-1]);$('next').onclick=()=>select(filtered[filtered.findIndex(c=>c.id===selected.id)+1]);
for(const s of ['closed','final'])$(s).onclick=()=>{stage=s;showState()};$('fit').onclick=resetView;
$('front').onclick=()=>{mv.cameraOrbit='0deg 90deg auto'};$('back').onclick=()=>{mv.cameraOrbit='180deg 90deg auto'};$('top').onclick=()=>{mv.cameraOrbit='0deg 1deg auto'};
$('zoomIn').onclick=()=>{const c=mv.getCameraOrbit();mv.cameraOrbit=`${c.theta}rad ${c.phi}rad ${c.radius*.8}m`};$('zoomOut').onclick=()=>{const c=mv.getCameraOrbit();mv.cameraOrbit=`${c.theta}rad ${c.phi}rad ${c.radius*1.25}m`};
mv.addEventListener('load',()=>{loadedSrc=currentSrc;markReady();resetView()});mv.addEventListener('error',()=>fatal('3D model failed to load. Try another example.'));
(async()=>{await customElements.whenDefined('model-viewer');const r=await fetch('catalog/index.json');if(!r.ok)throw Error('Catalog HTTP '+r.status);const data=await r.json();all=data.cases;filtered=all;$('overview').textContent=`${data.count} generated grasps · ${data.objects.length} object types · ${new Set(all.map(c=>c.scene)).size} sizes · real 3D meshes`;
 for(const [id,vals] of [['object',data.objects],['method',[...new Set(all.map(c=>c.method))].sort()]])for(const v of vals){const o=document.createElement('option');o.value=v;o.textContent=v;$(id).append(o)}
 const parts=location.hash.slice(1).split('/');stage=parts[1]==='final'?'final':'closed';select(all.find(c=>c.id===parts[0])||all[0]);
})().catch(fatal);
</script></body></html>
